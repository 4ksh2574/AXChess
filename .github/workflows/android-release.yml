name: Build AXChess Android APK

on:
  push:
    tags:
      - "v*"
      - "AXChess"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch or tag to build from"
        required: true
        default: "main"
        type: string
      release_tag:
        description: "New or existing GitHub Release tag for this APK"
        required: true
        default: "v1.1.0"
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone web assets
        run: bun run build:mobile

      - name: Prepare bundled Capacitor site
        run: |
          test -f dist/client/_shell.html
          rm -rf android-web
          mkdir -p android-web
          cp -a dist/client/. android-web/
          cp android-web/_shell.html android-web/index.html
          touch android-web/.nojekyll
          test -f android-web/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Capacitor tooling
        run: npm install --no-save --legacy-peer-deps --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Generate Android project
        run: npx cap add android

      - name: Sync bundled site into Android project
        run: npx cap sync android

      - name: Verify APK does not reference Lovable hosting
        run: |
          if grep -R "axchess.lovable.app" android-web capacitor.config.json; then
            echo "Unexpected remote Lovable URL found in standalone app assets."
            exit 1
          fi

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "AXChess-${{ steps.meta.outputs.release_tag }}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AXChess-${{ steps.meta.outputs.release_tag }}-APK
          path: AXChess-${{ steps.meta.outputs.release_tag }}-debug.apk

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ inputs.source_ref || github.sha }}
          files: AXChess-${{ steps.meta.outputs.release_tag }}-debug.apk
          fail_on_unmatched_files: true
          overwrite_files: true
