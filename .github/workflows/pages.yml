name: Deploy AXChess app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "bun.lock"
      - "vite.config.pages.ts"
      - ".github/workflows/pages.yml"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static AXChess app
        run: bun run build:pages
      - name: Prepare GitHub Pages fallback
        run: |
          test -f dist/client/_shell.html
          cp dist/client/_shell.html dist/client/404.html
          mkdir -p dist/client/project
          cp docs/index.html dist/client/project/index.html
          touch dist/client/.nojekyll
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client
      - name: Validate standalone Capacitor build
        run: |
          bun run build:mobile
          test -f dist/client/_shell.html
          if grep -R "https://axchess.lovable.app" dist/client; then
            echo "Standalone build unexpectedly references Lovable hosting."
            exit 1
          fi

  validate-android:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Build standalone mobile assets
        run: bun run build:mobile
      - name: Prepare bundled site
        run: |
          test -f dist/client/_shell.html
          rm -rf android-web
          mkdir -p android-web
          cp -a dist/client/. android-web/
          cp android-web/_shell.html android-web/index.html
          touch android-web/.nojekyll
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Install Capacitor tooling
        run: npm install --no-save --legacy-peer-deps --package-lock=false @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK for validation
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
